  <style>
    :root {
      --bg-color: #f8f6f1;
      --card-bg: #ffffff;
      --primary: #1e3a5f;
      --accent: #b8860b;
      --text-main: #222222;
      --text-muted: #5a5a5a;
      --border-color: #e2ddd2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 18px;
    }

    header {
      background: linear-gradient(135deg, #162c46 0%, #274973 100%);
      color: #ffffff;
      text-align: center;
      padding: 46px 20px 38px;
      border-bottom: 4px solid var(--accent);
    }

    header .subtitle-top {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #e6c675;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 34px;
      font-weight: normal;
      margin-bottom: 8px;
    }

    header .subtitle-bottom {
      font-size: 19px;
      color: #dce4ee;
      font-style: italic;
      white-space: nowrap;
    }

    nav {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px;
      gap: 6px;
    }

    nav a {
      text-decoration: none;
      color: var(--primary);
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      padding: 7px 12px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    nav a:hover,
    nav a:focus {
      background-color: var(--primary);
      color: #ffffff;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 30px 18px;
    }

    section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 32px;
      margin-bottom: 30px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.03);
      scroll-margin-top: 120px;
    }

    h2 {
      color: var(--primary);
      font-size: 27px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
    }

    p {
      margin-bottom: 14px;
    }

    .class-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .tab-btn {
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: bold;
      padding: 10px 18px;
      border: 2px solid var(--primary);
      background-color: #ffffff;
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background-color: var(--primary);
      color: #ffffff;
    }

    .class-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .class-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .teacher-box {
      background-color: #f3efe6;
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      margin-bottom: 18px;
      border-radius: 4px;
    }

    .note-box {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      background-color: #faf9f6;
      border: 1px dashed var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
